        #home {
          --hero-accent: var(--theme-primary);
        }

        #home.hero-section {
          background: radial-gradient(ellipse at 74% 48%, color-mix(in srgb, var(--hero-accent) 8%, transparent), transparent 48%);
        }

        #home .hero-name {
          font-size: clamp(4rem, 18cqi, 11rem);
          line-height: 0.9;
          width: max-content;
          transform: scaleX(0.45);
          transform-origin: left center;
          white-space: nowrap;
          color: var(--text-white);
        }

        #home .availability-badge {
          background: color-mix(in srgb, var(--theme-bg-darker) 72%, transparent);
          box-shadow: inset 0 1px rgba(255,255,255,.035), 0 8px 24px rgba(0,0,0,.12);
          backdrop-filter: blur(12px);
          -webkit-backdrop-filter: blur(12px);
        }

        #home .hero-name-theme {
          color: var(--theme-primary);
        }

        #home .hero-name-split-letter {
          display: inline-block;
          background: linear-gradient(90deg, var(--theme-primary) 0 50%, var(--text-white) 50% 100%);
          background-clip: text;
          -webkit-background-clip: text;
          color: transparent;
          -webkit-text-fill-color: transparent;
        }

        #home .hero-button {
          position: relative;
          min-height: 48px;
          overflow: hidden;
          isolation: isolate;
          border-radius: 12px;
          transform: translate(var(--magnetic-x, 0px), var(--magnetic-y, 0px));
          transition: transform 200ms ease;
        }

        #home .hero-button::before {
          position: absolute;
          z-index: -1;
          inset: 0;
          border-radius: inherit;
          background: color-mix(in srgb, var(--hero-accent) 18%, transparent);
          content: "";
          opacity: 0;
          transition: opacity 200ms ease;
        }

        #home .hero-button:hover {
          transform: translate(var(--magnetic-x, 0px), calc(var(--magnetic-y, 0px) - 2px));
        }

        #home .hero-button:hover::before {
          opacity: 1;
        }

        #home .hero-button:focus-visible {
          outline: 2px solid var(--hero-accent);
          outline-offset: 3px;
        }

        #home .hero-button--primary {
          border: 1px solid var(--hero-accent);
          background: var(--hero-accent);
          box-shadow: 0 6px 24px color-mix(in srgb, var(--hero-accent) 27%, transparent);
          color: var(--theme-bg-darkest);
        }

        #home .hero-button--secondary {
          border: 1px solid color-mix(in srgb, var(--hero-accent) 38%, transparent);
          background: color-mix(in srgb, var(--theme-bg-darker) 72%, transparent);
          color: var(--text-primary);
          backdrop-filter: blur(10px);
        }

        #home .hero-social-link:hover,
        #home .hero-scroll:hover {
          color: var(--hero-accent);
        }

        @media (min-width: 1024px) {
          #home .hero-layout {
            grid-template-areas: "copy visual" "social visual";
            grid-template-columns: minmax(0, 1.08fr) minmax(420px, 0.92fr);
            grid-template-rows: auto auto;
            column-gap: clamp(1.5rem, 3vw, 2.75rem);
            row-gap: 0;
          }

          #home .hero-copy {
            grid-area: copy;
          }

          #home .orbit-stack {
            grid-area: visual;
            grid-row: 1 / span 2;
          }

          #home .hero-social {
            grid-area: social;
          }

            display: flex;
